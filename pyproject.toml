[project]
name = "tool-retrieval-100k"
version = "0.1.0"
description = "Benchmark and research harness for LLM agent tool retrieval at 100K-tool scale."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0.0",
    "numpy>=1.26",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
trbench = "tool_retrieval_100k.cli:main"
a11yeval = "cowork_a11y_eval.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["tool_retrieval_100k*", "cowork_a11y_eval*"]
